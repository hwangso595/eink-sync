name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            extraction/requirements.txt
            extraction/requirements-test.txt

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r extraction/requirements-test.txt

      - name: Verify release version
        run: |
          node -e "const m=require('./manifest.json'); if (m.version !== process.env.GITHUB_REF_NAME) throw new Error('Tag must match manifest version')"

      - name: Verify source
        run: |
          npx tsc --noEmit
          npx eslint manifest.json src --quiet --format stylish
          npm test -- --runInBand
          cd extraction
          python -m pytest

      - name: Build release assets
        run: npm run build

      - name: Verify release assets and clean install
        run: npm run verify:release

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            main.js manifest.json styles.css
